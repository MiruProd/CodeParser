# .github/workflows/release.yml

name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

# Принудительно включаем режим UTF-8 в Python для решения проблем с кодировками на Windows
env:
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # Безопасно внедряем тег релиза в updater.py через bash-оболочку
      - name: Inject Version Tag
        shell: bash
        run: |
          python -c "
          import re
          path = 'src/core/updater.py'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          tag = '${{ github.ref_name }}'
          content = re.sub(r'CURRENT_VERSION\s*=\s*\"[^\"]+\"', f'CURRENT_VERSION = \"{tag}\"', content)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Build Executable
        run: |
          python build_scripts/build_exe.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CodeParser.exe
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}